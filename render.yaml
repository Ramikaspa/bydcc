services:
  - type: web
    name: byd-ocpp-simulator
    runtime: node
    plan: starter
    buildCommand: git clone --depth 1 --recurse-submodules https://github.com/matth-x/MicroOcppSimulator.git MicroOcppSimulator && cmake -S MicroOcppSimulator -B MicroOcppSimulator/build && cmake --build MicroOcppSimulator/build --target mo_simulator --parallel 2
    startCommand: sh render-start.sh
    healthCheckPath: /
    disk:
      name: byd-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8000"
